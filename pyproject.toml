[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-ecole-math"
version = "0.1.0"
description = "Perception mathématique de la conduite (homographie, Kalman, TTC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics",
  "opencv-python-headless",
  "torch",
  "torchvision",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "sqlalchemy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
